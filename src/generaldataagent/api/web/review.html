<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>独立审批 · GeneralDataAgent</title><link rel="stylesheet" href="/review/console.css"><script src="/review/console.js" defer></script></head><body>
<header><a href="/review" class="brand">G<span>↗</span>DA</a><div class="heading"><span class="eyebrow">独立审核 / 精确批准</span><h1>审批台</h1></div><button id="logout" hidden>断开连接</button></header>
<main><section class="connection" id="connection"><span class="tag">审核人入口</span><h2>核对内容，再做决定</h2><p>仅显示你已获准审核的范围。申请人不能批准自己的动作。</p><form id="connect-form"><label for="credential">审核人访问凭证</label><div class="connect-row"><input id="credential" type="password" autocomplete="off" spellcheck="false" maxlength="4096" required><button class="primary" type="submit">连接</button></div></form><p class="hint">凭证仅用于本页内存；批准会绑定当前显示的完整请求。</p></section>
<section id="workspace" hidden><div class="scope-bar"><p>待审请求及近期决定</p><button id="refresh">刷新记录</button></div><div class="layout"><aside><h2>审核队列</h2><div id="drafts"></div><button id="more" hidden>加载更早记录</button></aside><article id="detail"><h2>选择一条申请</h2><p>核对动作、影响范围和完整提交内容。</p></article></div></section><p id="notice" role="status" aria-live="polite"></p></main><footer><span>GeneralDataAgent / 独立审批服务</span><span>批准不等于执行；业务端仍需重新核验</span></footer></body></html>
