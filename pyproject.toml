[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generaldataagent"
version = "0.1.0"
description = "Governed multi-agent foundation for data analytics, data engineering, and data science"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "GeneralDataAgent contributors" }]
dependencies = [
  "cryptography>=46,<51",
  "deepagents>=0.7,<0.8",
  "duckdb>=1.4,<2",
  "fastapi>=0.128,<1",
  "langchain-anthropic>=1.3,<2",
  "langchain-openai>=1.1,<2",
  "langchain>=1.3,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlglot>=25,<30",
  "uvicorn>=0.38,<1",
  "pyjwt[crypto]>=2.10,<3",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
generaldataagent-api = "generaldataagent.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/generaldataagent"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
