name: CI

on:
  push:
    branches: [main, "feat/stage4-*", "feat/stage5-*", "feat/stage6-*", "feat/stage7-*", "feat/stage8-*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: stage4_synthetic
          # Public disposable CI fixture credential; never used by a deployed service.
          POSTGRES_PASSWORD: stage4_ci_synthetic_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d stage4_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
          --memory 512m --cpus 1
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python
        run: uv python install "${UV_PYTHON}"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Test
        env:
          GDA_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          GDA_TEST_POSTGRES_PASSWORD: stage4_ci_synthetic_only
        run: uv run --frozen pytest --cov=generaldataagent --cov-fail-under=85

      - name: Stage 4 security baseline
        run: uv run --frozen python evals/run_stage4_acceptance.py > "$RUNNER_TEMP/stage4-acceptance.json"

      - name: Stage 5 local business baseline
        run: uv run --frozen python evals/run_stage5_acceptance.py > "$RUNNER_TEMP/stage5-acceptance.json"

      - name: Stage 8 local science baseline
        run: >-
          uv run --frozen python evals/run_stage8_acceptance.py
          --include-sklearn --output "$RUNNER_TEMP/stage8-science"

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build
